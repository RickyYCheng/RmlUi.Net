name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  native:
    name: native
    uses: ./.github/workflows/native-build.yml

  smoke:
    name: smoke-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: RmlUi.Net/runtimes

      - name: Build smoke tests (warnings as errors)
        run: dotnet build tests/RmlUi.Net.SmokeTests/RmlUi.Net.SmokeTests.csproj -c Release -warnaserror

      - name: Run smoke tests (Windows, with window)
        if: runner.os == 'Windows'
        run: dotnet tests/RmlUi.Net.SmokeTests/bin/Release/net8.0/RmlUi.Net.SmokeTests.dll --window

      - name: Run smoke tests (Linux)
        if: runner.os == 'Linux'
        run: dotnet tests/RmlUi.Net.SmokeTests/bin/Release/net8.0/RmlUi.Net.SmokeTests.dll

      - name: Run smoke tests (macOS)
        if: runner.os == 'macOS'
        run: dotnet tests/RmlUi.Net.SmokeTests/bin/Release/net8.0/RmlUi.Net.SmokeTests.dll

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: RmlUi.Net/runtimes
          merge-multiple: true

      - name: Verify every platform artifact is present
        shell: bash
        run: |
          for f in \
            RmlUi.Net/runtimes/win-x64/native/RmlUiNative.dll \
            RmlUi.Net/runtimes/win-x86/native/RmlUiNative.dll \
            RmlUi.Net/runtimes/linux-x64/native/libRmlUiNative.so \
            RmlUi.Net/runtimes/osx-x64/native/RmlUiNative.dylib; do
            test -f "$f" || { echo "Missing native artifact: $f"; exit 1; }
          done

      - name: Pack NuGet package
        run: dotnet pack RmlUi.Net/RmlUi.Net.csproj -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RmlUi.Net.nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
