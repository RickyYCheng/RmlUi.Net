name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.pack.outputs.version }}

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-build.yml

  pack:
    runs-on: ubuntu-22.04
    needs: native
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: RmlUi.Net/runtimes
          merge-multiple: true
      - name: Pack release candidate
        id: package
        shell: bash
        run: |
          dotnet pack RmlUi.Net/RmlUi.Net.csproj -c Release -warnaserror -p:ContinuousIntegrationBuild=true -o artifacts
          version="$(dotnet msbuild RmlUi.Net/RmlUi.Net.csproj -getProperty:PackageVersion)"
          test -f "artifacts/RickyYC.RmlUi.Net.$version.nupkg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd artifacts && sha256sum *.nupkg > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-package-input
          path: artifacts/*
          if-no-files-found: error

  consume:
    name: consume-${{ matrix.rid }}
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64 }
          - { os: windows-2022, rid: win-x86 }
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/consumer-cache
      CANDIDATE_VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-package-input
          path: artifacts/feed
      - name: Build smoke tests against the package
        shell: pwsh
        run: |
          $project = 'tests/RmlUi.Net.SmokeTests/RmlUi.Net.SmokeTests.csproj'
          dotnet restore $project --configfile tests/Candidate.NuGet.Config "-p:CandidatePackageVersion=$env:CANDIDATE_VERSION" -p:UseAppHost=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project --no-restore -c Release -warnaserror "-p:CandidatePackageVersion=$env:CANDIDATE_VERSION" -p:UseAppHost=false -o artifacts/smoke
      - name: Exercise package through .NET
        if: matrix.rid != 'win-x86'
        run: dotnet artifacts/smoke/RmlUi.Net.SmokeTests.dll
      - name: Exercise package through 32-bit .NET
        if: matrix.rid == 'win-x86'
        shell: pwsh
        run: |
          $hostPath = "${env:ProgramFiles(x86)}\dotnet\dotnet.exe"
          if (!(Test-Path $hostPath) -or !((& $hostPath --list-runtimes) -match '^Microsoft.NETCore.App 8\.')) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
            & "$env:RUNNER_TEMP/dotnet-install.ps1" -Architecture x86 -Channel 8.0 -Runtime dotnet -InstallDir "$env:RUNNER_TEMP/dotnet-x86"
            $hostPath = "$env:RUNNER_TEMP/dotnet-x86/dotnet.exe"
          }
          & $hostPath artifacts/smoke/RmlUi.Net.SmokeTests.dll
