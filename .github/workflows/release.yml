name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'RickyYCheng/RmlUi.Net' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-package-input
          path: artifacts
      - name: Confirm candidate identity
        shell: bash
        working-directory: artifacts
        env:
          REQUESTED: ${{ inputs.version }}
          VERIFIED: ${{ needs.verify.outputs.version }}
        run: |
          test "$REQUESTED" = "$VERIFIED"
          test -f "RickyYC.RmlUi.Net.$VERIFIED.nupkg"
          sha256sum --check SHA256SUMS
      - uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified bytes to NuGet.org
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/RickyYC.RmlUi.Net.$VERSION.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json
