name: Release

# Manual release pipeline: rebuilds every native platform, packages and pushes
# the NuGet package (GitHub Packages + nuget.org) and creates a GitHub release.
on:
  workflow_dispatch: {}

jobs:
  native:
    name: native
    uses: ./.github/workflows/native-build.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: native
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: RmlUi.Net/runtimes
          merge-multiple: true

      - name: Verify every platform artifact is present
        shell: bash
        run: |
          for f in \
            RmlUi.Net/runtimes/win-x64/native/RmlUiNative.dll \
            RmlUi.Net/runtimes/win-x86/native/RmlUiNative.dll \
            RmlUi.Net/runtimes/linux-x64/native/libRmlUiNative.so \
            RmlUi.Net/runtimes/osx-x64/native/RmlUiNative.dylib; do
            test -f "$f" || { echo "Missing native artifact: $f"; exit 1; }
          done

      - name: Pack NuGet package
        run: dotnet pack RmlUi.Net/RmlUi.Net.csproj -c Release -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: RmlUi.Net.nupkg
          path: artifacts/RmlUi.Net.*.nupkg
          if-no-files-found: error

      - name: Push to NuGet (nuget.org and GitHub Packages)
        env:
          NUGET_ORG_KEY: ${{ secrets.NUGET_DEPLOY_KEY }}
          GITHUB_NUGET_KEY: ${{ secrets.CI_NUGET_API_KEY }}
        run: |
          dotnet nuget add source --username Chorizite --password "$GITHUB_NUGET_KEY" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Chorizite/index.json"
          dotnet nuget push artifacts/RmlUi.Net.*.nupkg --api-key "$NUGET_ORG_KEY" --source https://api.nuget.org/v3/index.json
          dotnet nuget push artifacts/RmlUi.Net.*.nupkg --api-key "$GITHUB_NUGET_KEY" --source github

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.1.0" \
            --repo="$GITHUB_REPOSITORY" \
            --title="RmlUi.Net v1.1.0" \
            --generate-notes \
            artifacts/RmlUi.Net.*.nupkg
