name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'RickyYCheng/RmlUi.Net' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-package-input
          path: artifacts
      - name: Confirm candidate identity
        shell: bash
        working-directory: artifacts
        env:
          REQUESTED: ${{ inputs.version }}
          VERIFIED: ${{ needs.verify.outputs.version }}
        run: |
          test "$REQUESTED" = "$VERIFIED"
          test -f "RickyYC.RmlUi.Net.$VERIFIED.nupkg"
          sha256sum --check SHA256SUMS
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified bytes to NuGet.org
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/RickyYC.RmlUi.Net.$VERSION.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json
