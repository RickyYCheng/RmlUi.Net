name: 'Build'
on:
  push:
    branches:
    - main
# Version is fixed in RmlUi.Net.csproj (VersionPrefix); bump it there and here
# for each release.
env:
  VERSION: 1.1.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet pack RmlUi.Net/RmlUi.Net.csproj -c Release --no-build -o RmlUi.Net/bin/Release

      - uses: actions/upload-artifact@v4
        with:
          name: "RmlUi.Net.${{ env.VERSION }}.nupkg"
          path: "${{ github.workspace }}/RmlUi.Net/bin/Release/*.nupkg"

      - uses: actions/upload-artifact@v4
        with:
          name: "RmlUi.Net.${{ env.VERSION }}.zip"
          path: "${{ github.workspace }}/RmlUi.Net/bin/Release/net8.0/"
