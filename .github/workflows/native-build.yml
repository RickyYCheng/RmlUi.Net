name: Native build
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64, msvc-arch: amd64, library: RmlUiNative.dll }
          - { os: windows-2022, rid: win-x86, msvc-arch: x86, library: RmlUiNative.dll }
          - { os: ubuntu-22.04, rid: linux-x64, library: libRmlUiNative.so }
          - { os: macos-15-intel, rid: osx-x64, library: RmlUiNative.dylib }
          - { os: macos-15, rid: osx-arm64, library: RmlUiNative.dylib }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build native library
        shell: pwsh
        env:
          MSVC_ARCH: ${{ matrix.msvc-arch }}
        run: |
          if ($IsWindows) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio 2022 with MSVC x86/x64 tools was not found.' }
            & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch $env:MSVC_ARCH -HostArch amd64 -SkipAutomaticLocation
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $cmakeArgs = @()
          if ($IsMacOS) { $cmakeArgs += '-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0' }
          cmake -S RmlUi.Native -B RmlUi.Native/out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build RmlUi.Native/out/ci --parallel
      - name: Verify managed imports
        shell: bash
        run: |
          dotnet build RmlUi.Net/RmlUi.Net.csproj -c Release -warnaserror -o artifacts/parity
          dotnet run --project tools/RmlUiExportParity -c Release -p:UseAppHost=false -- \
            --assembly artifacts/parity/RmlUi.Net.dll \
            --native "RmlUi.Native/out/ci/bin/${{ matrix.library }}"
      - name: Stage current platform
        shell: bash
        run: |
          dir="RmlUi.Net/runtimes/${{ matrix.rid }}/native"
          mkdir -p "$dir"
          cp "RmlUi.Native/out/ci/bin/${{ matrix.library }}" "$dir/"
      - name: Run unit tests
        if: matrix.rid != 'win-x86'
        run: dotnet test tests/RmlUi.Net.UnitTests -c Release -warnaserror -p:RmlNativeRid=${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: RmlUi.Net/runtimes/
          if-no-files-found: error
