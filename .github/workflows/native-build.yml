name: Native build
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64, arch: x64, library: RmlUiNative.dll }
          - { os: windows-2022, rid: win-x86, arch: x86, library: RmlUiNative.dll }
          - { os: ubuntu-22.04, rid: linux-x64, library: libRmlUiNative.so }
          - { os: macos-15-intel, rid: osx-x64, library: RmlUiNative.dylib }
          - { os: macos-15, rid: osx-arm64, library: RmlUiNative.dylib }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Build native library
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then args+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"); fi
          cmake -S RmlUi.Native -B RmlUi.Native/out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release "${args[@]}"
          cmake --build RmlUi.Native/out/ci --parallel
      - name: Verify managed imports
        shell: bash
        run: |
          dotnet build RmlUi.Net/RmlUi.Net.csproj -c Release -warnaserror
          dotnet run --project tools/RmlUiExportParity -c Release -- \
            --assembly RmlUi.Net/bin/Release/net8.0/RmlUi.Net.dll \
            --native "RmlUi.Native/out/ci/bin/${{ matrix.library }}"
      - name: Stage current platform
        shell: bash
        run: |
          dir="RmlUi.Net/runtimes/${{ matrix.rid }}/native"
          mkdir -p "$dir"
          cp "RmlUi.Native/out/ci/bin/${{ matrix.library }}" "$dir/"
      - name: Run unit tests
        if: matrix.rid != 'win-x86'
        run: dotnet test tests/RmlUi.Net.UnitTests -c Release -warnaserror -p:RmlNativeRid=${{ matrix.rid }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: RmlUi.Net/runtimes/
          if-no-files-found: error
