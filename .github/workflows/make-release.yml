name: 'Make Release'
# Manual release pipeline: tags, packs and publishes RmlUi.Net to nuget.org and
# GitHub Packages, then creates a GitHub release.
#
# The version is fixed in RmlUi.Net.csproj (VersionPrefix) and in VERSION below;
# bump both for each release. The native artifacts for all four platforms are
# committed under RmlUi.Net/runtimes/ (rebuilt by the native CI workflow).
on: workflow_dispatch
env:
  VERSION: 1.1.0
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
               -f "tag_name=release/${{ env.VERSION }}" -f "target_commitish=master" \
          | jq .body -r > release-notes.md

      - name: Git config
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.CI_PAT }}@github.com/${{ github.repository }}

      - name: Create release tag
        run: |
          git tag -a "release/${{ env.VERSION }}" -F release-notes.md
          git push origin "release/${{ env.VERSION }}"

      - name: Build and pack
        run: |
          dotnet restore
          dotnet build -c Release --no-restore "-p:PackageReleaseNotes=$(cat release-notes.md 2>/dev/null)"
          dotnet pack RmlUi.Net/RmlUi.Net.csproj -c Release --no-build -o RmlUi.Net/bin/Release

      - uses: actions/upload-artifact@v4
        with:
          name: "RmlUi.Net.${{ env.VERSION }}.nupkg"
          path: "${{ github.workspace }}/RmlUi.Net/bin/Release/RmlUi.Net.${{ env.VERSION }}.nupkg"

      - uses: actions/upload-artifact@v4
        with:
          name: "RmlUi.Net.${{ env.VERSION }}.zip"
          path: "${{ github.workspace }}/RmlUi.Net/bin/Release/net8.0/"

      - name: Push NuGet Package
        env:
          GITHUB_NUGET_KEY: ${{ secrets.CI_NUGET_API_KEY }}
          NUGET_ORG_KEY: ${{ secrets.NUGET_DEPLOY_KEY }}
        run: |
          dotnet nuget add source --username Chorizite --password "$GITHUB_NUGET_KEY" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Chorizite/index.json"
          dotnet nuget push "${{ github.workspace }}/RmlUi.Net/bin/Release/RmlUi.Net.${{ env.VERSION }}.nupkg" --api-key "$GITHUB_NUGET_KEY" --source "github"
          dotnet nuget push "${{ github.workspace }}/RmlUi.Net/bin/Release/RmlUi.Net.${{ env.VERSION }}.nupkg" --api-key "$NUGET_ORG_KEY" --source https://api.nuget.org/v3/index.json

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "release/${{ env.VERSION }}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="Release v${{ env.VERSION }}" \
              --generate-notes \
              "${{ github.workspace }}/RmlUi.Net/bin/Release/RmlUi.Net.${{ env.VERSION }}.nupkg#RmlUi.Net.${{ env.VERSION }}.nupkg"

      - name: Bump version
        run: |
          git commit --allow-empty -m "Bump version"
          git push origin master
